        ambient: '#352119'
      },
      'coconut-cloud-chocolate': {
        title: 'Coconut Cloud Chocolate',
        text: 'Coconut water, coconut cold foam & toasted coconut with premium rich chocolate.',
        img: '../../assets/coconut-iced-latte.jpg',
        price: '$9.50',
        ambient: '#2D211A'
      }
    };

    function hoverCategory(id) {
      const el = document.getElementById(id);
      if (!el.classList.contains('category-open')) {
        document.querySelectorAll('.category-group').forEach(group => {
          group.classList.remove('category-open');
        });
        el.classList.add('category-open');
      }
    }

    function toggleCategory(id) {
      const el = document.getElementById(id);
      const isOpening = !el.classList.contains('category-open');
      
      document.querySelectorAll('.category-group').forEach(group => {
        group.classList.remove('category-open');
      });

      if (isOpening) {
        el.classList.add('category-open');
      }
    }

    function showDrink(key, element) {
      const drink = drinks[key];
      const img = document.getElementById('drink-image');
      const video = document.getElementById('drink-video');
      const desc = document.getElementById('drink-description');
      const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase');
      const ambient = document.getElementById('ambient-grad');
      
      // Update Sidebar Visuals
      document.querySelectorAll('.drink-nav-item').forEach(btn => {
        btn.classList.add('opacity-50');
        btn.querySelector('.nav-line').classList.remove('active-nav-line');
        btn.querySelector('.nav-line').classList.add('inactive-nav-line');
      });
      
      element.classList.remove('opacity-50');
      element.querySelector('.nav-line').classList.remove('inactive-nav-line');
      element.querySelector('.nav-line').classList.add('active-nav-line');

      // Animate Transition Out
      desc.style.opacity = '0';
      desc.style.transform = 'translateY(30px)';
      img.style.opacity = '0';
      img.style.transform = 'scale(1.1)';
      video.style.opacity = '0';
      video.style.transform = 'scale(1.1)';
      
      setTimeout(() => {
        // Update Content
        document.getElementById('drink-title').innerText = drink.title;
        document.getElementById('drink-text').innerText = drink.text;
        document.getElementById('drink-price').innerText = drink.price;
        
        // Update Ambient Colors
        const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase') || document.documentElement;
        if (body) {
          body.style.backgroundColor = drink.ambient;
        }
        ambient.style.background = `linear-gradient(to right, ${drink.ambient} 0%, transparent 100%)`;
        
        if (drink.video) {
          // Hide Image, Show Video
          img.classList.add('hidden');
          video.classList.remove('hidden');
          
          // Animate Video In
          video.style.opacity = '1';
          video.style.transform = 'scale(1.05)';
          video.play().catch(e => console.log('Autoplay blocked or video not ready:', e));
        } else {
          // Hide Video, Show Image
          video.classList.add('hidden');
          video.pause();
          img.classList.remove('hidden');
          img.src = drink.img;
          
          // Animate Image In
          img.style.opacity = '1';
          img.style.transform = 'scale(1.05)';
        }
        
        // Reveal panel when selecting new drink
        desc.classList.remove('panel-hidden');
        desc.style.opacity = '1';
        desc.style.transform = 'translateY(0)';
      }, 400);
    }

    function hidePanel() {
      const panel = document.getElementById('drink-description');
      panel.classList.add('panel-hidden');
    }

    function revealPanel() {
      const panel = document.getElementById('drink-description');
      if (panel.classList.contains('panel-hidden')) {
        panel.classList.remove('panel-hidden');
        panel.style.opacity = '1';
        panel.style.transform = 'translateY(0)';
      }
    }

    // High-precision Ping-Pong (yo-yo) Video Loop Controller
    function initPingPongVideo(video) {
      let direction = 1; // 1 = forward, -1 = reverse
      let lastTime = performance.now();
      let animationFrameId = null;

      // Remove the standard looping behavior so we can manage it programmatically
      video.removeAttribute('loop');

      function tick(now) {
        if (video.classList.contains('hidden')) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
          return;
        }

        const dt = (now - lastTime) / 1000; // time delta in seconds
        lastTime = now;

        if (!video.duration || isNaN(video.duration)) {
          animationFrameId = requestAnimationFrame(tick);
          return;
        }

        const duration = video.duration;
        const t = video.currentTime;
        // Dynamic boundary window (25% of duration, max 1.2s)
        const easingWindow = Math.min(1.2, duration * 0.25);

        // Smooth quadratic easing factor for luxury acceleration/deceleration
        let speedMultiplier = 1.0;
        if (t < easingWindow) {
          const factor = t / easingWindow;
          speedMultiplier = 0.12 + 0.88 * (factor * factor); // decelerate smoothly towards 0
        } else if (t > duration - easingWindow) {
          const factor = (duration - t) / easingWindow;
          speedMultiplier = 0.12 + 0.88 * (factor * factor); // decelerate smoothly towards the end
        }

        // Keep inside high-performance limits to avoid browser render starvation
        speedMultiplier = Math.max(0.1, Math.min(1.0, speedMultiplier));

        if (direction === 1) {
          // Play Forward
          if (video.paused) {
            video.play().catch(() => {});
          }
          video.playbackRate = speedMultiplier;

          // Transition to reverse just before the hard absolute end
          if (t >= duration - 0.08) {
            direction = -1;
            video.pause();
          }
        } else {
          // Play Reverse (by seeking frame-by-frame)
          if (!video.paused) {
            video.pause();
          }
          const nextTime = t - dt * speedMultiplier;

          // Transition back to forward just before reaching the hard absolute start
          if (nextTime <= 0.08) {
            video.currentTime = 0.08;
            direction = 1;
            video.play().catch(() => {});
          } else {
            video.currentTime = nextTime;
          }
        }

        animationFrameId = requestAnimationFrame(tick);
      }

      // Re-arm loop ticks when state changes or resumes
      video.addEventListener('play', () => {
        lastTime = performance.now();
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(tick);
        }
      });

      video.addEventListener('pause', () => {
        if (direction === 1) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      });

      // Kick off the loop initially
      lastTime = performance.now();
      animationFrameId = requestAnimationFrame(tick);
    }

    // Initialize
    window.onload = () => {
      toggleCategory('cat-matcha');
      const video = document.getElementById('drink-video');
      if (video) {
        initPingPongVideo(video);
      }
    }
  </script>
