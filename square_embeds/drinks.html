ctive-nav-line'); const activeTextSpan = element.querySelector('span:last-child'); activeTextSpan.classList.remove('font-light'); activeTextSpan.classList.add('font-semibold'); // Animate Transition Out desc.style.opacity = '0'; desc.style.transform = 'translateY(30px)'; img.style.opacity = '0'; img.style.transform = 'scale(1.1)'; video.style.opacity = '0'; video.style.transform = 'scale(1.1)'; setTimeout(() => { // Update Content document.getElementById('drink-title').innerText = drink.title; document.getElementById('drink-text').innerText = drink.text; document.getElementById('drink-price').innerText = drink.price; // Update Ambient Colors const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase') || document.documentElement; if (body) { body.style.backgroundColor = drink.ambient; } ambient.style.background = `linear-gradient(to right, ${drink.ambient} 0%, transparent 100%)`; if (drink.video) { // Hide Image, Show Video img.classList.add('hidden'); video.classList.remove('hidden'); // Animate Video In video.style.opacity = '1'; video.style.transform = 'scale(1.05)'; video.play().catch(e => console.log('Autoplay blocked or video not ready:', e)); } else { // Hide Video, Show Image video.classList.add('hidden'); video.pause(); img.classList.remove('hidden'); img.src = drink.img; // Animate Image In img.style.opacity = '1'; img.style.transform = 'scale(1.05)'; } // Reveal panel when selecting new drink desc.classList.remove('panel-hidden'); desc.style.opacity = '1'; desc.style.transform = 'translateY(0)'; }, 400); } function hidePanel() { const panel = document.getElementById('drink-description'); panel.classList.add('panel-hidden'); } function revealPanel() { const panel = document.getElementById('drink-description'); if (panel.classList.contains('panel-hidden')) { panel.classList.remove('panel-hidden'); panel.style.opacity = '1'; panel.style.transform = 'translateY(0)'; } } // Initialize window.onload = () => { toggleCat
