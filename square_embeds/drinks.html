itle').innerText = config.title; document.getElementById('drink-text').innerText = config.text; document.getElementById('drink-price').innerText = config.price; // Update ambient colors const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase') || document.documentElement; if (body) { body.style.backgroundColor = config.ambient; } ambient.style.background = `linear-gradient(to right, ${config.ambient} 0%, transparent 100%)`; // Update image img.src = config.img; img.style.opacity = '1'; // Fade in details desc.style.opacity = '1'; desc.style.transform = 'translateY(0)'; }, 250); } function showDrink(key, element) { currentDrinkKey = key; panelManuallyClosed = false; // Reset close state since the selection has changed! const drink = drinks[key]; const img = document.getElementById('drink-image'); const video = document.getElementById('drink-video'); const desc = document.getElementById('drink-description'); const ambient = document.getElementById('ambient-grad'); const tempSwitch = document.getElementById('drink-temp-switch'); // Update Sidebar Visuals document.querySelectorAll('.drink-nav-item').forEach(btn => { btn.classList.add('opacity-50'); btn.querySelector('.nav-line').classList.remove('active-nav-line'); btn.querySelector('.nav-line').classList.add('inactive-nav-line'); }); element.classList.remove('opacity-50'); element.querySelector('.nav-line').classList.remove('inactive-nav-line'); element.querySelector('.nav-line').classList.add('active-nav-line'); // Animate Transition Out desc.style.opacity = '0'; desc.style.transform = 'translateY(30px)'; img.style.opacity = '0'; img.style.transform = 'scale(1.1)'; video.style.opacity = '0'; video.style.transform = 'scale(1.1)'; setTimeout(() => { // Resolve target drink config based on temp toggle let config = drink; if (drink.hasTempToggle) { currentDrinkTemp = 'hot'; // default to hot when selecting a new drink config = drink[currentDrinkTemp]; tempSwitch.classList.remove('hidden'); tempSwitch.classList.add('flex'); updateTempSwitchUI(currentDrinkTemp); } else { tempSwitch.classList.remove('flex'); tempSwitch.classList.add('hidden'); } // Update Content document.getElementById('drink-title').innerText = config.title; document.getElementById('drink-text').innerText = config.text; document.getElementById('drink-price').innerText = config.price; // Update Ambient Colors const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase') || document.documentElement; if (body) { body.style.backgroundColor = config.ambient; } ambient.style.background = `linear-gradient(to right, ${config.ambient} 0%, transparent 100%)`; if (config.video) { // Hide Image, Show Video img.classList.add('hidden'); video.classList.remove('hidden'); // Animate Video In video.style.opacity = '1'; video.style.transform = 'scale(1.05)'; video.play().catch(e => console.log('Autoplay blocked or video not ready:', e)); } else { // Hide Video, Show Image video.classList.add('hidden'); video.pause(); img.classList.remove('hidden'); img.src = config.img; // Animate Image In img.style.opacity = '1'; img.style.transform = 'scale(1.05)'; } // Reveal panel when selecting new drink desc.classList.remove('panel-hidden'); desc.style.opacity = '1'; desc.style.transform = 'translateY(0)'; }, 400); } function hidePanel() { const panel = document.getElementById('drink-description'); panel.classList.add('panel-hidden'); panelManuallyClosed = true; // Lock in the closed state until selection changes } function revealPanel() { if (panelManuallyClosed) return; // Stay hidden if the close button was explicitly clicked const panel = document.getElementById('drink-description'); if (panel.classList.contains('panel-hidden')) { panel.classList.remove('panel-hidden'); panel.style.opacity = '1'; panel.style.transform = 'translateY(0)'; } } // Initialize window.onload = () => { toggleCategory('cat-matcha'); } </script>
